[project]
name = "anki-vocab"
version = "0.2.0"
description = "CLI skill for AI agents to create and maintain Anki vocabulary cards with TTS audio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Aspisov" }]
keywords = ["anki", "anki-connect", "vocabulary", "cli", "tts", "agent-skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]
urls = { Homepage = "https://github.com/aspisov/anki-vocab" }
dependencies = [
    "edge-tts>=7.2.7",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.14.10",
    "pre-commit>=4.5.1",
    "twine>=6.2.0",
]

[project.scripts]
anki-vocab = "anki_vocab.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
